<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inner Land Minesweeper</title>
    <style>
      /* The game panel doesn't paint a full-bleed ground, so the host body must — otherwise the
         host's card shows through the (transparent) iframe as a white surround. Use the game's own
         dark ground so the embed is self-consistent in any host theme. */
      html, body { margin: 0; min-height: 100%; background: #05070c; }
      /* Fill the width the host gives us and let the game measure a real available width. The host
         sizes the iframe height from our posted content height. */
      body { padding: 8px 6px; }
      #app { width: 100%; max-width: 720px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
