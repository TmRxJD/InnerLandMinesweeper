<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inner Land Minesweeper</title>
    <style>
      /* Transparent ground: the game's own panel (.ilm-root) paints its dark card, so leaving the
         body transparent lets the HOST site's chosen background show through around it instead of a
         black canvas. The host must also keep its frame transparent for this to reach the page. */
      html, body { margin: 0; min-height: 100%; background: transparent; }
      /* Let the game measure a real available width. The host sizes the iframe height from our
         posted content height. */
      body { padding: 0; }
      #app { width: 100%; max-width: 720px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
